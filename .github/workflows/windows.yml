# Builds the Windows opengl32.dll proxy (x64 and Win32, Release) on every push, on GitHub's own
# Windows machines — so a testable DLL can be had without Visual Studio installed. The result is on
# the run's page (Actions tab) to download, as MXS-Remastered-Windows. For MX Simulator on Apple
# Silicon via Wine, use the x64 opengl32.dll.
name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # The engine sound packs are built locally by tools/engine_sounds and are .gitignored, so a
      # fresh checkout doesn't have them — but the project copies them next to the DLL, which fails
      # if they're missing. Create empty placeholders so the copy succeeds. They're optional engine
      # sounds and aren't part of the DLL, so empty files are harmless (just no custom sounds).
      - name: Stub optional sound packs (not committed to the repo)
        shell: bash
        run: |
          mkdir -p MXS_REMASTERED_sounds
          for p in 125 250 250f 450f 450f_clear; do
            touch "MXS_REMASTERED_sounds/MXS_REMASTERED_engine_default${p}.pack"
          done

      - name: Build x64 (Release)
        run: msbuild MXCamProxy.vcxproj /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Build Win32 (Release)
        run: msbuild MXCamProxy.vcxproj /m /nologo /v:minimal /p:Configuration=Release /p:Platform=Win32

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MXS-Remastered-Windows
          path: |
            bin/x64/Release/opengl32.dll
            bin/Win32/Release/opengl32.dll
          if-no-files-found: error
